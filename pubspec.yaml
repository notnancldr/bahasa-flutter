name: bahasa
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  drift: ^2.35.0
  flutter_animate: ^4.5.2
  flutter_bloc: ^9.1.1
  go_router: ^18.0.1
  hydrated_bloc: ^11.0.0
  intl: any
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  sqlite3: ^3.4.0
  sqlite3_flutter_libs: ^0.6.0+eol
  network_info_plus: ^8.2.1
  path_provider: ^2.1.6
  shelf_multipart: ^2.0.1
  material_symbols_icons: ^4.2960.0
  shared_preferences: ^2.5.5
  pretty_qr_code: ^3.6.0
  country_flags: ^4.1.2
  json_annotation: ^4.12.0
  flutter_svg: ^2.3.0
  file_picker: ^13.1.0
  android_file_picker: ^2.1.0
  mobile_scanner: ^7.4.2
  palette_generator_master: ^1.1.0
  flutter_litert_lm: ^0.3.0
  google_generative_ai: ^0.4.7
  flutter_dotenv: ^6.0.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  json_serializable: ^6.14.1
  build_runner: ^2.16.2

flutter:
  assets:
    - .env
  fonts:
    - family: NunitoSans
      fonts:
        - asset: fonts/NunitoSans-Regular.ttf
        - asset: fonts/NunitoSans-Italic.ttf
          style: italic
  uses-material-design: true
  generate: true
